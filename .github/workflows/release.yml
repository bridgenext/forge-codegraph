name: Release

# Manually triggered ("Run workflow"). On trigger it:
#   1. reads the version from package.json,
#   2. promotes `## [Unreleased]` content into `## [<version>]` in
#      CHANGELOG.md (and commits + pushes that change back to main), so
#      the published release notes are never sparse just because the
#      maintainer didn't pre-stage the [<version>] block by hand,
#   3. builds a self-contained bundle for every platform (one runner — there's no
#      native compilation, so cross-packaging is fine),
#   4. creates the GitHub Release (tag v<version>) with all archives + a
#      SHA256SUMS manifest, using the release notes from CHANGELOG.md.
#
# Before triggering: bump package.json. CHANGELOG.md entries can live under
# `## [Unreleased]` — step 2 takes care of moving them.
#
# STAGING RUNS. A production release is irreversible in practice — teammates'
# installers resolve `releases/latest` the moment it publishes — so there needs
# to be a way to rehearse the whole path first. Two ways in:
#
#   - tick `prerelease` on a manual dispatch, or
#   - push a tag matching `v*-rc*` (e.g. `v1.6.0-rc.1`), from ANY branch.
#
# The tag route is the one that works before a merge: `workflow_dispatch` is
# only offered for workflows on the default branch, so a feature branch cannot
# dispatch this at all — which is exactly when a rehearsal has value. "Resolve
# release mode" below decides staging-vs-production ONCE and fails closed, so a
# branch build cannot become a production release even by accident.
#
# A staging run changes three things, and nothing else:
#   - the release is flagged pre-release, which GitHub excludes from BOTH the
#     /releases/latest API and the releases/latest redirect. Those are the only
#     two ways install.sh discovers a version, so a default install can never
#     resolve to a staging build; you reach it deliberately with
#     CODEGRAPH_VERSION=<tag>.
#   - step 2 is skipped and no step pushes to main, so a rehearsal cannot
#     consume the [Unreleased] block or move the branch. Notes come from
#     [Unreleased] instead.
#   - the tag comes from the `tag` input (e.g. v1.6.0-rc.1), so staging does
#     not require bumping package.json on main.
# Everything else — kernel matrix, bundle build, SHA256SUMS, attestation — runs
# exactly as it does for a real release, which is the point: the parts that can
# only fail in CI are the parts being rehearsed.
#
# BRIDGENEXT FORK — distribution is GitHub Releases ONLY. Upstream additionally
# published an npm thin-installer under @colbymchenry using OIDC trusted
# publishing, which cannot work here: trusted publishing is bound to the
# upstream repo + workflow on npmjs.com, and this fork owns no npm scope. That
# step is removed rather than left to fail — and removing it also removes the
# risk of a misconfigured run publishing an internal build to a public
# registry. Teammates install via install.sh / install.ps1 (see README).
#
# If Bridgenext later wants an npm channel, `scripts/pack-npm.sh` is still in
# the tree and already scoped to @bridgenext — add a publish step plus the
# registry credentials then.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Staging run: publish as a pre-release (hidden from releases/latest, no push to main)'
        type: boolean
        default: false
      tag:
        description: 'Release tag override, e.g. v1.6.0-rc.1 (default: v<package.json version>)'
        type: string
        default: ''
  # Pushing an -rc tag builds a staging release from THAT tag's commit.
  #
  # This exists because `workflow_dispatch` is only offered for workflows on the
  # default branch, so a release cannot be rehearsed from a feature branch
  # before merging — which is precisely when rehearsing is worth anything. A
  # `push` trigger has no such restriction: it runs the workflow file from the
  # pushed ref, so an -rc tag on any branch works.
  #
  # Safe by construction rather than by discipline: the "Resolve release mode"
  # step forces STAGING for every trigger except a workflow_dispatch from the
  # default branch, so a tag push can only ever produce a pre-release — it
  # cannot promote the CHANGELOG, cannot push to main, and cannot become
  # `releases/latest`. The tag pattern excludes plain vX.Y.Z on purpose: a
  # production tag must go through an explicit dispatch.
  push:
    tags:
      - 'v*-rc*'

permissions:
  contents: write      # create the GitHub Release + tag, push the CHANGELOG promote
  id-token: write      # OIDC token for the build-provenance attestation
  attestations: write  # store the GitHub artifact attestations for the bundles

jobs:
  # Native extraction-kernel prebuilds (docs/design/rust-kernel-migration-plan.md).
  # As of 1.5.0 the kernel is the release's HEADLINE, not an optional extra, so
  # this matrix is REQUIRED: a failed kernel build blocks the release instead of
  # silently shipping wasm-only bundles under a Rust-engine banner. Per-file
  # wasm fallback still exists at runtime for erroring files and unsupported
  # platforms — but every published bundle must carry its .node. Note the
  # vendored-grammar-C languages (kotlin/lua/scala/dart) compile parser.c via
  # the cc crate, so each leg needs its platform C toolchain (runner images
  # ship one). (Runner images ship rustup; build-kernel.sh
  # adds each cross target itself.)
  kernel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - runner: ubuntu-22.04 # oldest glibc runner → widest compatibility
            targets: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
          - runner: windows-latest
            targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build kernel prebuilds
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            bash scripts/build-kernel.sh --target "$t"
          done
          ls -R codegraph-kernel/prebuilds
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.runner }}
          path: codegraph-kernel/prebuilds/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: kernel
    steps:
      - uses: actions/checkout@v6
        with:
          # Default checkout is detached at a SHA; we need an actual branch
          # so the CHANGELOG-promote commit knows where to push.
          ref: ${{ github.ref }}
          # Authenticate as the maintainer (admin), not as github-actions[bot].
          # The "Require PR approval for main branch" ruleset only lets the
          # Admin repo role bypass — and GitHub blocks adding the GitHub
          # Actions integration to bypass_actors on user-owned (non-org)
          # repos with "Actor GitHub Actions integration must be part of
          # the ruleset source or owner organization." So the auto-promote
          # and auto-sync `git push origin HEAD:main` steps below both fail
          # under the default GITHUB_TOKEN. Using a fine-grained PAT owned
          # by the admin makes the push go through cleanly. Set the
          # RELEASE_PAT secret with: contents:write on this repo, no other
          # scopes. Rotate per your token policy; the workflow only runs
          # on manual dispatch so the blast radius is small.
          #
          # Falls back to the job's own GITHUB_TOKEN when the secret is unset.
          # An unset secret interpolates to the EMPTY STRING, and checkout
          # rejects that outright — "Input required and not supplied: token" —
          # so without this fallback the job dies at step 2, before it can even
          # report what is wrong. That is pure friction for a STAGING run,
          # which pushes nothing and therefore never needs the elevated token:
          # `contents: write` on the default GITHUB_TOKEN is enough to create
          # the release. A production run genuinely does need the PAT, so the
          # "Resolve release mode" step below fails it fast and explains why,
          # rather than letting it build for 20 minutes and die at the push.
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # The published package is @bridgenext/codegraph. registry-url is what
          # makes setup-node write an .npmrc that reads NODE_AUTH_TOKEN, so the
          # publish step below can authenticate.
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release mode
        id: mode
        # Single source of truth for "is this a rehearsal?", computed once and
        # consumed by every step below, so the answer cannot differ between
        # them. Fails CLOSED: staging unless a run proves it is the real thing,
        # which is a workflow_dispatch, from the default branch, with
        # `prerelease` unticked. Everything else — an -rc tag push, a dispatch
        # from a feature branch — is forced to staging.
        #
        # This is what makes releasing from a branch safe: a branch build is
        # structurally incapable of promoting the CHANGELOG, pushing to main,
        # or becoming `releases/latest`. It does not depend on the operator
        # remembering to tick a box.
        env:
          # Read as an env var, not interpolated into the script: keeps the
          # secret out of the rendered command line, and lets us test only
          # whether it is SET without ever echoing it.
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          STAGING=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             && [ "${{ inputs.prerelease }}" != "true" ]; then
            STAGING=false
          fi
          echo "staging=$STAGING" >> "$GITHUB_OUTPUT"

          # A production run pushes the CHANGELOG promote (and possibly a
          # lock-file sync) to the default branch, which needs the PAT to get
          # past the branch ruleset. Checking here means the run fails in
          # seconds with an actionable message instead of after the full
          # kernel + bundle build. Staging never pushes, so it is exempt.
          if [ "$STAGING" = "false" ] && [ -z "${RELEASE_PAT:-}" ]; then
            echo "::error::A production release needs the RELEASE_PAT secret (fine-grained, contents:write on this repo). Without it the CHANGELOG promote cannot push to ${{ github.event.repository.default_branch }}. Set it in Settings → Secrets and variables → Actions, or re-run as a staging build (push a v*-rc* tag, or tick 'prerelease')."
            exit 1
          fi
          # Same reasoning for the npm channel: a production run publishes
          # @bridgenext/codegraph, so a missing token is a fail-fast, not a
          # surprise at the end of the build. Staging only dry-runs the pack.
          if [ "$STAGING" = "false" ] && [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::A production release needs the NPM_TOKEN secret (an npm automation token with publish rights on the @bridgenext scope) to publish @bridgenext/codegraph. Set it in Settings → Secrets and variables → Actions, or re-run as a staging build."
            exit 1
          fi
          if [ "$STAGING" = "true" ]; then
            echo "::notice::STAGING run (event=${{ github.event_name }}, ref=${{ github.ref }}) — publishes a pre-release, does not touch ${{ github.event.repository.default_branch }}."
          else
            echo "::notice::PRODUCTION release from ${{ github.ref }}."
          fi

      - name: Sync package-lock.json if version drifted
        # When the maintainer bumps the version on package.json only — for
        # example via a GitHub web-UI edit — `npm ci` would refuse to run
        # with `EUSAGE: npm ci can only install packages when your
        # package.json and package-lock.json … are in sync`. This step
        # rewrites just the lock-file's version fields (top-level + the
        # `packages.""` entry) to match package.json, then auto-commits
        # and pushes the result so on-disk truth on `main` stays
        # consistent. Idempotent: if the lock file already matches, no
        # commit is made.
        run: |
          set -euo pipefail
          PKG_V=$(node -p "require('./package.json').version")
          LOCK_V=$(node -p "require('./package-lock.json').version")
          if [ "$PKG_V" = "$LOCK_V" ]; then
            echo "package-lock.json already at $PKG_V — nothing to sync."
            exit 0
          fi
          echo "Lock-file version drift: lock=$LOCK_V, package=$PKG_V. Syncing."
          # `--package-lock-only` rewrites only the lock file, doesn't
          # touch node_modules or actually install anything. Cheap.
          npm install --package-lock-only --ignore-scripts
          # Sanity: lockfile should now report the package version.
          NEW_LOCK_V=$(node -p "require('./package-lock.json').version")
          if [ "$NEW_LOCK_V" != "$PKG_V" ]; then
            echo "::error::lock-file still at $NEW_LOCK_V after sync attempt; expected $PKG_V"; exit 1
          fi
          if git diff --quiet -- package-lock.json; then
            echo "lock file unchanged after sync? bailing"; exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "release: sync package-lock.json to ${PKG_V}" -m "[skip ci] Auto-generated by Release workflow."
          # The commit itself is needed either way (a dirty tree would break
          # later steps), but a staging run must not move main — keep it local.
          if [ "${{ steps.mode.outputs.staging }}" = "true" ]; then
            echo "Staging run — lock-file sync kept local, not pushed."
          else
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      - run: npm ci
      - name: Ensure zip/unzip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip

      - name: Resolve version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        # Defaults to v<package.json version>; the `tag` input overrides it so a
        # staging build can publish v1.6.0-rc.1 without bumping package.json on
        # main. The leading `v` is normalized here because install.sh normalizes
        # it too — `case "$version" in v*) ;; *) version="v$version" ;; esac` —
        # so a tag published as bare `dev` is unreachable by the installer,
        # which would look for `vdev` and 404 on download.
        run: |
          set -euo pipefail
          # An -rc tag push already names the tag — use it verbatim rather than
          # deriving a second, different one from package.json.
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
            [ -n "$TAG" ] || TAG="v${{ steps.ver.outputs.version }}"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (staging=${{ steps.mode.outputs.staging }})"

      - name: Promote [Unreleased] → [<version>] in CHANGELOG.md
        # Skipped on a staging run: promoting would consume the [Unreleased]
        # block and push to main, so a rehearsal would silently spend the notes
        # meant for the real release.
        if: ${{ steps.mode.outputs.staging != 'true' }}
        # Idempotent: a no-op if [Unreleased] is empty OR if the previous
        # run already moved everything. Auto-commit + push the change back
        # so the version block on main is the source of truth going
        # forward (and so subsequent extract-release-notes.mjs calls
        # surface the full content even if this run is re-triggered).
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          before=$(git rev-parse HEAD)
          node scripts/prepare-release.mjs "$V"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged — nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs(changelog): promote [Unreleased] into [${V}]" -m "[skip ci] Auto-generated by Release workflow."
            # Push to the branch the workflow was triggered on (main).
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      - name: Download kernel prebuilds
        # All legs are required (see the kernel job), so every target's
        # <target>/codegraph-kernel.node must be present in release/kernel/.
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-*
          merge-multiple: true
          path: release/kernel/

      - name: Kernel contract + full walker-parity gate
        # Runs EVERY kernel suite (__tests__/kernel-*.test.ts — the wire
        # contract, the grammar-source parity table checks, and all 20
        # languages' walker byte-parity suites incl. torture/CRLF/defer pins)
        # against the freshly built linux-x64 .node. The glob keeps this gate
        # current as languages are added. CODEGRAPH_KERNEL_EXPECT=1 turns a
        # missing binary into a FAILURE, and a missing prebuild fails outright
        # — the matrix is required, so absence here means a wiring bug.
        run: |
          if [ -f release/kernel/linux-x64/codegraph-kernel.node ]; then
            mkdir -p codegraph-kernel/prebuilds/linux-x64
            cp release/kernel/linux-x64/codegraph-kernel.node codegraph-kernel/prebuilds/linux-x64/
            CODEGRAPH_KERNEL_EXPECT=1 npx vitest run __tests__/kernel-*.test.ts
          else
            echo "::error::linux-x64 kernel prebuild missing despite required matrix"
            exit 1
          fi

      - name: Build all platform bundles
        run: |
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            bash scripts/build-bundle.sh "$t"
          done
          ls -lh release

      - name: Generate SHA256SUMS
        # Published as a release asset; the npm launcher verifies downloaded
        # bundles against it (basenames only, so its path.basename match works).
        run: |
          ( cd release && sha256sum codegraph-* > SHA256SUMS )
          cat release/SHA256SUMS

      - name: Attest build provenance for release bundles
        # Signed, publicly-verifiable proof that each bundle (and SHA256SUMS)
        # was built by this workflow from this repo — SHA256SUMS alone only
        # proves integrity, not origin, since it ships next to the bundles.
        # Verify any downloaded artifact with:
        #   gh attestation verify <file> -R bridgenext/forge-codegraph
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/codegraph-*
            release/SHA256SUMS

      - name: Release notes from CHANGELOG.md
        # The [<version>] block was guaranteed-populated by the
        # "Promote" step above, so the [Unreleased] fallback should
        # never be needed in practice. Kept for defense-in-depth.
        run: |
          V="${{ steps.ver.outputs.version }}"
          if [ "${{ steps.mode.outputs.staging }}" = "true" ]; then
            # Staging: the promote step was skipped, so the pending notes are
            # still under [Unreleased]. An empty block is fine here — a
            # rehearsal is judged on the artifacts, not the prose — so unlike
            # the real path this does not fail the run.
            node scripts/extract-release-notes.mjs Unreleased > notes.md 2>/dev/null || true
            [ -s notes.md ] || echo "Staging build ${{ steps.tag.outputs.tag }} — not a release." > notes.md
          else
            node scripts/extract-release-notes.mjs "$V" > notes.md 2>/dev/null \
              || node scripts/extract-release-notes.mjs Unreleased > notes.md 2>/dev/null || true
            if [ ! -s notes.md ]; then
              echo "::error::No release notes in CHANGELOG.md for [$V] or [Unreleased]."
              exit 1
            fi
          fi
          echo "----- release notes -----"; cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # `--prerelease` is what keeps a staging build out of the
          # /releases/latest API and the releases/latest redirect — the only two
          # paths install.sh uses to resolve a version when CODEGRAPH_VERSION is
          # unset. Without it, a rehearsal would immediately become the version
          # every teammate's installer picks up.
          FLAGS=""
          if [ "${{ steps.mode.outputs.staging }}" = "true" ]; then
            FLAGS="--prerelease"
          fi
          # Idempotent: create the release once, otherwise (re-run) refresh assets.
          # Note the re-run branch only refreshes ASSETS — it will not flip an
          # existing release's prerelease flag, so never reuse a production tag
          # for a staging run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/codegraph-* release/SHA256SUMS --clobber
          else
            gh release create "$TAG" release/codegraph-* release/SHA256SUMS \
              --title "$TAG" --notes-file notes.md $FLAGS
          fi

      - name: Publish @bridgenext/codegraph to npm
        # The package users install is @bridgenext/codegraph. It is NOT the
        # repo's root package.json (which stays `private` so a stray
        # `npm publish` at the root can never ship the wrong contents under the
        # right name) — scripts/pack-npm.sh synthesizes the published manifests
        # from the bundles built above:
        #   @bridgenext/codegraph-<target>  one per platform, os/cpu tagged
        #   @bridgenext/codegraph           the shim, with those in
        #                                   optionalDependencies
        # so npm downloads only the bundle matching the user's machine.
        #
        # Order matters: the per-platform packages must exist on the registry
        # before the shim that depends on them, or a fresh install races a
        # missing optional dependency.
        #
        # Runs AFTER the GitHub Release exists, because the shim's self-heal
        # fallback fetches release assets when an optional dep is unavailable
        # (a registry mirror that did not mirror the platform package).
        #
        # Staging only DRY-RUNS: a rehearsal must never occupy a real version
        # on the public registry, since npm versions are immutable and cannot
        # be meaningfully unpublished after 72h.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          bash scripts/pack-npm.sh "$V"

          STAGING="${{ steps.mode.outputs.staging }}"
          if [ "$STAGING" = "true" ]; then
            echo "::notice::STAGING - dry-running the npm publish, nothing is sent to the registry."
          fi

          publish_dir() {
            dir="$1"
            name="$(node -p "require('$PWD/$dir/package.json').name")"
            if [ "$STAGING" = "true" ]; then
              ( cd "$dir" && npm publish --dry-run --access public )
              return 0
            fi
            # Idempotent: a re-run of an already-published version is a no-op
            # rather than a hard EPUBLISHCONFLICT failure.
            if npm view "$name@$V" version >/dev/null 2>&1; then
              echo "::notice::$name@$V already on the registry - skipping."
              return 0
            fi
            # --access public: a scoped package defaults to restricted on its
            # first publish, which would make it un-installable for everyone.
            # --provenance: signed link back to this workflow run; requires the
            # synthesized `repository` field to match this repo, which
            # pack-npm.sh sets.
            ( cd "$dir" && npm publish --access public --provenance )
            echo "::notice::published $name@$V"
          }

          for d in release/npm/codegraph-*; do
            [ -d "$d" ] || continue
            publish_dir "$d"
          done
          publish_dir release/npm/main
